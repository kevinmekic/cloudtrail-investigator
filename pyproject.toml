[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctinv"
dynamic = ["version"]
description = "CloudTrail Investigator: offline forensic analysis of AWS CloudTrail logs (learning project)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kevin Mekic" }]
dependencies = [
    "duckdb>=1.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "markdown-it-py[linkify]>=3.0",
    "pytest>=8.0",
    # Exact version: lint and format results change between ruff releases, and
    # local runs and CI must agree.
    "ruff==0.17.0",
]

[project.scripts]
ctinv = "ctinv.cli:main"

[tool.hatch.version]
path = "src/ctinv/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "datasets: needs the fetched datasets in data/ (skipped if absent; deselect with -m 'not datasets')",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
