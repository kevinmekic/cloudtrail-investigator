id: credentials-created-for-other-user
title: Access key or console password created for another user
severity: medium
attack:
  technique: T1098.001
  name: "Account Manipulation: Additional Cloud Credentials"
  tactics: [persistence, privilege-escalation]
description: >
  An access key (CreateAccessKey) or console password (CreateLoginProfile)
  created for an IAM user other than the caller. Without a userName the call
  targets the caller itself and is not reported. User names are compared
  case-insensitively, as IAM does. Failed attempts are reported as well. One
  finding per call.
rationale: >
  New credentials on someone else's user are a classic backdoor: they keep
  working after the attacker's original access is revoked, and they carry that
  user's permissions, which may be more than the attacker had. Tactics:
  Persistence and Privilege Escalation, the two tactics ATT&CK lists for this
  technique.
false_positives:
  - Administrators creating credentials for new users or rotating keys for
    them.
  - Root creating keys for IAM users, common in small accounts such as
    flaws.cloud.
known_gaps:
  - Denied calls often have no request parameters in CloudTrail, so their
    target user is unknown and they are not reported.
  - Other credential types (UpdateLoginProfile password resets, service-specific
    credentials, SSH public keys, signing certificates) are not covered.
query: |
  SELECT coalesce(identity_arn, identity_type) AS principal,
         event_name || ' for user ' || (request_parameters->>'userName')
           || coalesce(' (failed: ' || error_code || ')', '') AS summary,
         [event_id] AS evidence_event_ids
  FROM events
  WHERE event_source = 'iam.amazonaws.com'
    AND event_name IN ('CreateAccessKey', 'CreateLoginProfile')
    AND (request_parameters->>'userName') IS NOT NULL
    AND (user_name IS NULL OR lower(request_parameters->>'userName') <> lower(user_name))
